  <title id="title">CHROMALUM — symmetric color graph, edges only</title>
  <desc id="desc">
    Hamming-distance 1 and 2 edges of the eight GRB binary color states, viewed along the 111-to-000 body diagonal with 111 nearest the
    viewer, red above and cyan below. All 24 edges retain their XOR-mask colors, original opacity and back-to-front paint order. Vertex
    markers and labels are omitted. The 000 and 111 positions coincide in projection.
  </desc>
